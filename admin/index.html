const u = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open_(pw) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:u(D.s), iterations:D.i, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:u(D.v)}, key, u(D.d)));
  try { sessionStorage.setItem('nakom-admin', pw); } catch (e) {}
  document.open(); document.write(html); document.close();
}
document.getElementById('f').onsubmit = async e => { e.preventDefault(); const err = document.getElementById('err'); err.textContent = 'Ellenőrzés…';
  try { await open_(document.getElementById('pw').value); } catch (x) { err.textContent = 'Hibás jelszó.'; } };
